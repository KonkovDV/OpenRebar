name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Lint workflow files
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore OpenRebar.sln --locked-mode -p:EnableWindowsTargeting=true -p:Platform=x64

      - name: Build
        run: dotnet build OpenRebar.sln --no-restore --configuration Release -p:EnableWindowsTargeting=true -p:Platform=x64

      - name: Verify formatting
        run: dotnet format OpenRebar.sln --verify-no-changes --no-restore

      - name: Test
        run: |
          dotnet test tests/OpenRebar.Domain.Tests/OpenRebar.Domain.Tests.csproj --no-build --configuration Release -f net8.0 --verbosity normal --logger "trx;LogFileName=test-results.trx"
          dotnet test tests/OpenRebar.Infrastructure.Tests/OpenRebar.Infrastructure.Tests.csproj --no-build --configuration Release -f net8.0 --verbosity normal --logger "trx;LogFileName=test-results.trx"
          dotnet test tests/OpenRebar.TestCorpus/OpenRebar.TestCorpus.csproj --no-build --configuration Release -f net8.0 --verbosity normal --logger "trx;LogFileName=test-results.trx"
          dotnet test tests/OpenRebar.Application.Tests/OpenRebar.Application.Tests.csproj --no-build --configuration Release -f net10.0 --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Verify README regression claim
        run: python tools/ci/verify_readme_regression_claim.py

      - name: Test libraries on net10
        env:
          OPENREBAR_TFM_HASH_DIR: ${{ github.workspace }}/artifacts/tfm/net10
        run: |
          mkdir -p artifacts/tfm/net10
          dotnet test tests/OpenRebar.Domain.Tests/OpenRebar.Domain.Tests.csproj --no-build --configuration Release -f net10.0 --logger "trx;LogFileName=tfm-net10-results.trx"
          dotnet test tests/OpenRebar.Infrastructure.Tests/OpenRebar.Infrastructure.Tests.csproj --no-build --configuration Release -f net10.0 --logger "trx;LogFileName=tfm-net10-results.trx"
          dotnet test tests/OpenRebar.TestCorpus/OpenRebar.TestCorpus.csproj --no-build --configuration Release -f net10.0 --logger "trx;LogFileName=tfm-net10-results.trx"

      - name: Compare net8 and net10 outputs
        run: |
          mkdir -p artifacts/tfm/net8
          OPENREBAR_TFM_HASH_DIR="$PWD/artifacts/tfm/net8" dotnet test tests/OpenRebar.Infrastructure.Tests/OpenRebar.Infrastructure.Tests.csproj --no-build --configuration Release -f net8.0 --filter FullyQualifiedName~Schedule_HashFile
          OPENREBAR_TFM_HASH_DIR="$PWD/artifacts/tfm/net8" dotnet test tests/OpenRebar.TestCorpus/OpenRebar.TestCorpus.csproj --no-build --configuration Release -f net8.0 --filter FullyQualifiedName~CorpusA0_HashFile
          python tools/ci/compare_tfm_hashes.py artifacts/tfm/net8 artifacts/tfm/net10

      - name: Generate dependency governance reports
        run: |
          mkdir -p artifacts/dependency-audit
          dotnet list OpenRebar.sln package --include-transitive --vulnerable > artifacts/dependency-audit/deps-vulnerable.txt || true
          dotnet list OpenRebar.sln package --outdated > artifacts/dependency-audit/deps-outdated.txt || true

      - name: Run benchmark gate and export summary
        env:
          OPENREBAR_BENCH_SUMMARY_PATH: artifacts/benchmark/column-generation-summary.json
        run: |
          mkdir -p artifacts/benchmark
          dotnet test tests/OpenRebar.Infrastructure.Tests/OpenRebar.Infrastructure.Tests.csproj --no-build --configuration Release -f net8.0 --filter FullyQualifiedName~ColumnGenerationBenchmarkPackTests --logger "trx;LogFileName=benchmark-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"

      - name: Upload dependency governance reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audit
          path: artifacts/dependency-audit/

      - name: Upload benchmark summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: benchmark-summary
          path: |
            artifacts/benchmark/column-generation-summary.json
            **/benchmark-results.trx

      - name: Publish CLI
        run: dotnet publish src/OpenRebar.Cli/OpenRebar.Cli.csproj --no-build --configuration Release --output ./publish/cli

      - name: Generate SBOM
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb
        with:
          path: ./publish/cli
          artifact-name: OpenRebar-sbom.spdx.json
          output-file: ./publish/OpenRebar-sbom.spdx.json

  python-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install ML dependencies
        run: python -m pip install --require-hashes -r ml/requirements.locked.txt

      - name: Validate locked requirements hash entries
        run: |
          python - <<'PY'
          from pathlib import Path

          lock_path = Path("ml/requirements.locked.txt")
          text = lock_path.read_text(encoding="utf-8")
          if "--hash=sha256:" not in text:
              raise SystemExit(f"No sha256 hashes found in {lock_path}")
          print(f"OK: hash entries detected in {lock_path}")
          PY

      - name: Validate model manifest
        run: python ml/scripts/validate_model_manifest.py ml/models/MANIFEST.json

      - name: Run Python smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ml
        working-directory: ml
        run: pytest tests -q

  benchmark-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore OpenRebar.sln --locked-mode -p:EnableWindowsTargeting=true -p:Platform=x64

      - name: Build
        run: dotnet build OpenRebar.sln --no-restore --configuration Release -p:EnableWindowsTargeting=true -p:Platform=x64

      - name: Require batch corpus manifest
        env:
          OPENREBAR_BATCH_CORPUS_ROOT: ${{ secrets.OPENREBAR_BATCH_CORPUS_ROOT }}
        run: |
          if [ -z "$OPENREBAR_BATCH_CORPUS_ROOT" ]; then
            echo "corpus: NotEvaluated" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export OPENREBAR_REQUIRE_BATCH_CORPUS=1
          dotnet test tests/OpenRebar.Application.Tests/OpenRebar.Application.Tests.csproj --no-build --configuration Release -f net10.0 --filter FullyQualifiedName~BatchReinforcementCorpusFixtureTests

  corpus-note:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Corpus is outside the push lane
        run: |
          echo "corpus: NotEvaluated" >> "$GITHUB_STEP_SUMMARY"
