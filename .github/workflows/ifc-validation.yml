name: IFC validation

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/OpenRebar.Infrastructure/Export/**"
      - "src/OpenRebar.Domain/Ports/IIfcExporter.cs"
      - "tools/ci/validate_ifc_examples.py"
      - "examples/**"

permissions:
  contents: read

jobs:
  ifc-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore OpenRebar.sln --locked-mode -p:EnableWindowsTargeting=true

      - name: Build
        run: dotnet build OpenRebar.sln --no-restore --configuration Release -p:EnableWindowsTargeting=true

      - name: Validate IFC examples
        run: python3 tools/ci/validate_ifc_examples.py

      - name: Upload IFC validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ifc-validation
          path: artifacts/ifc-validation/
