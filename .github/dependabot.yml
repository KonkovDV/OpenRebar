version: 2
updates:
  # One entry so one package bump opens one pull request, not one per project.
  - package-ecosystem: "nuget"
    directories:
      - "/src/OpenRebar.Application"
      - "/src/OpenRebar.Domain"
      - "/src/OpenRebar.Infrastructure"
      - "/src/OpenRebar.RevitPlugin"
      - "/src/OpenRebar.Cli"
      - "/tests/OpenRebar.Application.Tests"
      - "/tests/OpenRebar.Domain.Tests"
      - "/tests/OpenRebar.Infrastructure.Tests"
      - "/tests/OpenRebar.Cli.Tests"
      - "/tests/OpenRebar.TestCorpus"
    schedule:
      interval: "weekly"
    # Q-5 is still open. ImageSharp stays on 3.1.12 (MIT). Version 4 requires a
    # license key at build, and the Split License is paid for commercial use
    # above $1M revenue: https://docs.sixlabors.com/articles/imagesharp/
    # Version 3.2.0 does not patch the five accepted advisories. They are fixed
    # only in 4.1.2, and the audit exception is pinned to 3.1.12.
    # FluentAssertions 8+ is commercial. v7 stays open source:
    # https://www.fluentassertions.com/releases/
    ignore:
      - dependency-name: "SixLabors.ImageSharp"
        versions: [">=3.2.0"]
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"

  - package-ecosystem: "pip"
    directory: "/ml"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
